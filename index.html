<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182868" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>しばクエスト</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" data-phase="boot">
      <div id="stage">
        <canvas id="battle" width="192" height="240"></canvas>
      </div>
      <div id="desk">
        <section id="enemies" class="window">
          <p id="enemy-name">だんご</p>
        </section>
        <section id="party" class="window">
          <div class="who">
            <div class="line">
              <span class="nm">しば</span>
              <span class="hp" id="hp-text"></span>
              <span id="charge"></span>
            </div>
            <span class="atb"><i id="hp-fill"></i></span>
          </div>
          <div id="roster" hidden></div>
          <div class="meta">
            <canvas id="bone-icon" width="32" height="16"></canvas>
            <span id="bones">0</span>
            <span id="record" hidden></span>
          </div>
        </section>
      </div>
      <div id="commands" class="window" hidden>
        <button type="button" data-command="attack"><i class="mark"></i>こうげき</button>
        <button type="button" data-command="charge"><i class="mark"></i>ためる</button>
        <button type="button" data-command="guard"><i class="mark"></i>まもる</button>
        <button type="button" data-command="combo" hidden><i class="mark"></i>れんけい</button>
      </div>
      <canvas id="finger" width="48" height="64" hidden></canvas>
      <div id="modal" hidden>
        <p id="result-record" hidden></p>
        <button type="button" id="retry" class="window">もういちど</button>
        <button type="button" id="recruit" aria-label="ほね">
          <canvas id="recruit-bone" width="220" height="120"></canvas>
        </button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
