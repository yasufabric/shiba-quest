<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>しばクエスト</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" data-phase="boot">
      <header id="hud">
        <div id="bars">
          <div class="hp" id="hero-hp">
            <div id="hp-fill"></div>
            <span id="hp-text"></span>
          </div>
          <div class="hp ally" id="ally-hp" hidden>
            <div id="ally-fill"></div>
          </div>
        </div>
        <div id="bone-count">
          <canvas id="bone-icon" width="32" height="16"></canvas>
          <span id="bones">0</span>
        </div>
        <div id="record" hidden></div>
      </header>
      <div id="stage">
        <canvas id="battle" width="192" height="224"></canvas>
      </div>
      <div id="commands">
        <button type="button" data-command="attack">こうげき</button>
        <button type="button" data-command="charge">ためる</button>
        <button type="button" data-command="guard">まもる</button>
      </div>
      <canvas id="finger" width="48" height="64" hidden></canvas>
      <div id="modal" hidden>
        <button type="button" id="retry">もういちど</button>
        <button type="button" id="recruit" aria-label="ほね">
          <canvas id="recruit-bone" width="220" height="120"></canvas>
        </button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
